name: CI

on:
  push:
    branches:
      - main
      - develop
      - "copilot/**"
      - "agent/**"
  pull_request:
    branches:
      - main
      - develop
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7

      - name: Install Qt runtime packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Validate dependency graph
        run: uv pip check

      - name: Validate package import
        run: |
          uv run python -c "from dicom_overlay.infrastructure.openclaw_client import OpenClawClient; OpenClawClient(gateway_url='ws://127.0.0.1:18789')"

  test:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    needs:
      - compatibility
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: openclaw/package-lock.json

      - name: Install Qt runtime packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          uv sync --locked --extra dev --python 3.12
          npm ci --prefix openclaw --ignore-scripts

      - name: Run test suite
        run: |
          uv run python -m pytest tests/unit tests/integration tests/smoke -m "not gui and not slow"
