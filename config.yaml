# Modality registry overrides / additions (optional).
# The built-in modalities (EKG, CXR, CT_BRAIN) work without this section.
# Use it to tweak a built-in (e.g. icon) or to add a NEW modality without code
# changes. Each entry's fields:
#   skill_name     OpenClaw skill folder (defaults to dicom-<key>-analysis)
#   checklist_keys required keys the output validator enforces (omit to skip)
#   icon           emoji shown in the overlay summary panel
#   display_name   human-facing label
#   aliases        alternate spellings that resolve to this modality
#   model_hint     reserved hint for routing to a different backing model
#   supported      set false to hide a modality from the analysis cycle
#
# Example — add KUB (abdominal X-ray) and an echo modality:
#
# modalities:
#   KUB:
#     display_name: KUB (Abdominal X-Ray)
#     icon: "🩻"
#     skill_name: dicom-kub-analysis
#     aliases: [ABDOMINAL_XRAY, ABDO_XRAY]
#     checklist_keys: [bowel_gas, free_air, calcifications, bones, soft_tissue]
#   ECHO:
#     display_name: Echocardiogram
#     icon: "💓"
#     skill_name: dicom-echo-analysis
#     model_hint: video-capable-model
