debug:
  log_file: overlay_agent.log
  log_level: INFO
  save_screenshots: false
analysis:
  trigger_mode: hybrid
  # Multi-pass interpretation: after a coarse read, re-examine abnormal regions
  # at full ROI resolution to refine bounding boxes. The bounded default keeps
  # the workflow clinically useful without unbounded model calls.
  multi_pass_enabled: true
  multi_pass_max_zoom_targets: 2
hotkeys:
  dismiss_overlay: ctrl+shift+d
  toggle_enable: ctrl+shift+e
  trigger_manual: ctrl+shift+a
monitor:
  debounce_stable_sec: 1.5
  hash_algorithm: ahash
  hash_threshold: 5
  polling_interval_ms: 500
  window_title_keywords:
  - DICOM
  - 影像
  - Viewer
openclaw:
  connect_timeout_sec: 15
  # Fresh portable OpenClaw startup can include migrations and antivirus scans.
  gateway_start_timeout_sec: 180
  gateway_url: ws://127.0.0.1:18789
  inference_timeout_sec: 180
  # Request OpenClaw fast service for the 60/100/180-second analysis SLA.
  # This may consume priority capacity from the configured provider/subscription.
  fast_mode: true
  reconnect_interval_sec: 5
  timeout_sec: 30
overlay:
  control_bar: true
  control_bar_position: bottom_right
  critical_persist: true
  display_duration_sec: 30
  fade_duration_ms: 500
  position: right
  region_highlights: true
  summary_panel: true
phi_roi:
  # A clean bundle must never inherit one workstation's screen coordinates.
  # The desktop prompts after it detects the actual DICOM viewer, then stores
  # viewer-relative margins and reference dimensions here.
  configured: false
  coordinate_space: viewer
  reference_width: 0
  reference_height: 0
  top: 0
  bottom: 0
  left: 0
  right: 0
