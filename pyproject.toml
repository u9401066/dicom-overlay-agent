[project]
name = "dicom-overlay-agent"
version = "0.1.0"
description = "AI-assisted DICOM image overlay agent for medical image co-reading"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "寧寧", email = "ning@kmuh.org.tw" }
]
keywords = ["dicom", "overlay", "medical-imaging", "ai-assistant", "ekg", "cxr"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "PyQt6>=6.6.0",
    "mss>=9.0.0",
    "pywin32>=306; platform_system == 'Windows'",
    "websockets>=12.0",
    "PyYAML>=6.0",
    "Pillow>=10.0.0",
    "pystray>=0.19.0",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.3.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "bandit[toml]>=1.7.5",
    "pre-commit>=3.6.0",
    "types-PyYAML",
    "types-Pillow",
]
build = [
    "PyInstaller>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.3.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "bandit[toml]>=1.7.5",
    "pre-commit>=3.6.0",
    "types-PyYAML",
    "types-Pillow",
]

[project.scripts]
dicom-overlay = "dicom_overlay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dicom_overlay"]

# === Ruff ===
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "RUF",
]
# RUF001/RUF003: fullwidth punctuation (，：；「」) is intentional, correct
# typography for the Traditional-Chinese UI strings this product renders.
ignore = ["E501", "RUF001", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["dicom_overlay"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004"]
"scripts/hooks/*.py" = ["RUF002"]

# === MyPy ===
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["mss.*", "pystray.*", "win32gui.*", "win32con.*", "win32api.*"]
ignore_missing_imports = true

# === Pytest ===
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/smoke"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["--strict-markers", "--tb=short", "-ra", "--show-capture=no"]
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "data",
    "openclaw",
    "openclaw-home",
    ".uv-cache-codex",
    "node_modules",
    "vendor",
    "dist",
    "build",
]
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests",
    "gui: GUI tests (require display)",
    "slow: Slow running tests",
]

# === Coverage ===
[tool.coverage.run]
source = ["src/dicom_overlay"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true

# === Bandit ===
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
